name: Bygg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Varje bygge får ett eget versionsnummer: 1.0.<byggnummer>. Syns i filnamnet och under Plugins i Emby.
      - name: Sätt version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Tester
        run: dotnet test tests/Bestall.Tests -c Release

      - name: Bygg pluginet
        run: dotnet build src/Bestall/Bestall.csproj -c Release -p:Version=$VERSION

      - name: Döp filen efter versionen
        run: |
          mkdir -p ut
          cp src/Bestall/bin/Release/netstandard2.0/Emby-Seerr.dll "ut/Emby-Seerr-$VERSION.dll"

      - name: Ladda upp Emby-Seerr-${{ env.VERSION }}.dll
        uses: actions/upload-artifact@v4
        with:
          name: Emby-Seerr-${{ env.VERSION }}
          path: ut/Emby-Seerr-${{ env.VERSION }}.dll
          if-no-files-found: error

      - name: Skapa release (vid tagg v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ut/Emby-Seerr-${{ env.VERSION }}.dll
          generate_release_notes: true
